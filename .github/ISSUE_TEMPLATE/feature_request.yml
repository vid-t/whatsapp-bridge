name: Idea
description: Suggest a change or a missing feature.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        whatsapp-bridge is read-only by default. Sending is opt-in, and limited to text to
        ticked chats. If your idea needs more sending, presence or read receipts, start a
        discussion first.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
